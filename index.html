<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Aniassué lôgôfié douman</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2A49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lôgôfié Douman">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F2F5F0;--surface:#fff;--ink:#17221B;--muted:#58695D;--line:#D6DED4;--indigo:#1B2A49;--chalk:#F4D35E;--green:#2E7D4F;--on-green:#fff;--bad:#B3261E;--up:#2E7D4F;--down:#B3261E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101612;--surface:#18211B;--ink:#EAF0E8;--muted:#9AAA9F;--line:#2A362D;--indigo:#0E1830;--green:#4CAF78;--on-green:#08150D;--bad:#FF8A80;--up:#6FD39A;--down:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101612;--surface:#18211B;--ink:#EAF0E8;--muted:#9AAA9F;--line:#2A362D;--indigo:#0E1830;--green:#4CAF78;--on-green:#08150D;--bad:#FF8A80;--up:#6FD39A;--down:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{background:var(--indigo);color:#fff;padding:18px 0 22px}
header h1{font-size:24px}
header p{margin:6px 0 0;color:#C9D3E8;font-size:15px}
h2{font-size:20px;margin:24px 0 10px}
.slate{background:var(--indigo);color:var(--chalk);border-radius:14px;padding:14px;margin-top:-14px;box-shadow:0 0 0 3px var(--line)}
.slate h2{margin:0 0 4px;color:var(--chalk);font-size:19px}
.slate small{color:#C9D3E8}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;min-width:0;table-layout:fixed} th,td{overflow-wrap:anywhere} .price-note{display:block;margin-top:8px;color:#C9D3E8;font-size:12px;line-height:1.45}
th,td{padding:7px 6px;text-align:right;border-bottom:1px dashed rgba(244,211,94,.35);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:#C9D3E8}
td.gain{color:#fff;font-weight:700}
.t-up{color:var(--up)}.t-down{color:var(--down)}
.slate .t-up{color:#8CE0AE}.slate .t-down{color:#FFB4AB}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-size:17px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:14px}
.btn{background:var(--green);color:var(--on-green);border:0;border-radius:10px;padding:12px 16px;font:600 16px system-ui,sans-serif;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.block{width:100%;margin-top:10px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:16px system-ui,sans-serif;min-height:44px}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.sum{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:14px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .tot{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.err{color:var(--bad);font-weight:600;margin-top:8px;min-height:1.2em}
.steps{display:flex;gap:4px;margin:12px 0 4px}
.steps span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--green)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;scrollbar-width:thin}
nav button{flex:0 0 82px;border:0;background:transparent;color:var(--muted);padding:10px 2px;font:600 12px system-ui,sans-serif;min-height:56px;cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button[aria-current="page"]{color:var(--green);box-shadow:inset 0 3px 0 var(--green)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.show{opacity:1}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font:14px system-ui,sans-serif;margin:18px 0;cursor:pointer}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Aniassué lôgôfié douman</h1>
<p>Du village à la ville, le bon marché.</p>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<nav aria-label="Navigation principale">
<button data-tab="marche"><b>🌾</b>Marché</button>
<button data-tab="vendre"><b>📣</b>Vendre</button>
<button data-tab="acheter"><b>🛒</b>Acheter</button>
<button data-tab="commandes"><b>🚚</b>Commandes</button>
<button data-tab="releves"><b>📋</b>Relevés</button>
<button data-tab="stands"><b>🏪</b>Stands</button>
<button data-tab="transport"><b>🚛</b>Transport</button>
<button data-tab="inscription"><b>📝</b>Inscription</button>
</nav>
<script>
var SEED={stocks:[],orders:[],next:1};
var PRICES=[
 {p:"Maïs grain",v:170,a:470},
 {p:"Riz local blanchi",v:600,a:700},
 {p:"Banane plantain",v:480,a:610},
 {p:"Igname Kponan",v:680,a:800},
 {p:"Manioc doux",v:190,a:470}];
var TRANSPORT={"Abidjan":20,"Bouaké":25,"Yamoussoukro":22,"Abengourou":8};
var COM=0.05;
var STEPS=["Commande reçue","Chargée au village","En route","Livrée"];
var S=clone(SEED),tab="marche",pick=null;
var submissions=[],standListings=[],transporters=[],standPhotoData="";
try{standListings=JSON.parse(localStorage.getItem("ald-stands")||"[]");if(!Array.isArray(standListings))standListings=[]}catch(e){standListings=[]}
try{transporters=JSON.parse(localStorage.getItem("ald-transporters")||"[]");if(!Array.isArray(transporters))transporters=[]}catch(e){transporters=[]}
function saveStands(){try{localStorage.setItem("ald-stands",JSON.stringify(standListings))}catch(e){toast("Mémoire du téléphone pleine : photo ou annonce trop volumineuse.")}}
function saveTransporters(){try{localStorage.setItem("ald-transporters",JSON.stringify(transporters))}catch(e){toast("Impossible d’enregistrer ce profil sur cet appareil.")}}
try{submissions=JSON.parse(localStorage.getItem("ald-market-submissions")||"[]");if(!Array.isArray(submissions))submissions=[]}catch(e){submissions=[]}
function saveSubmissions(){try{localStorage.setItem("ald-market-submissions",JSON.stringify(submissions))}catch(e){}}
try{var raw=localStorage.getItem("ald-v2");if(raw){var d=JSON.parse(raw);if(d&&d.stocks&&d.orders){S=d}}}catch(e){}
function clone(o){return JSON.parse(JSON.stringify(o))}
function save(){try{localStorage.setItem("ald-v2",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function F(n){return Math.round(n).toLocaleString("fr-FR")+" F"}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2400)}
function go(t){tab=t;render();window.scrollTo(0,0)}
function arrow(t){return t==="up"?'<span class="t-up">↑</span>':t==="down"?'<span class="t-down">↓</span>':"–"}

function vMarche(){
 var rows=PRICES.map(function(x){return "<tr><td>"+esc(x.p)+"</td><td>"+F(x.v)+"</td><td>"+F(x.a)+"</td></tr>"}).join("");
 var list=S.stocks.filter(function(s){return s.q>0}).map(function(s){
  return '<div class="card"><div class="row"><h3>'+esc(s.p)+'</h3><strong>'+F(s.pr)+'/kg</strong></div>'+
  '<div class="muted">'+esc(s.v)+' · '+esc(s.who)+'</div>'+
  '<div class="row" style="margin-top:8px"><span>'+s.q.toLocaleString("fr-FR")+' kg disponibles</span>'+
  '<button class="btn" onclick="buy('+s.id+')">Commander</button></div></div>'}).join("");
 return cta()+'<section class="slate"><h2>Prix de référence, par kilo</h2><small>Prix à la consommation (F CFA/kg)</small>'+
  '<div class="scroll"><table><tr><th>Produit</th><th>Aniassué*</th><th>Abidjan</th></tr>'+rows+'</table></div>'+
  '<small class="price-note">* Aniassué : référence régionale d’Abengourou, et non relevé direct du village. Source : OCPV, semaine du 02 au 08 novembre 2026. Ces prix sont des prix à la consommation, pas des prix garantis aux producteurs. À actualiser dès réception d’un nouveau relevé.</small></section>'+
  '<h2>Stocks disponibles</h2>'+(list||'<div class="empty">Aucun stock vérifié pour le moment. Les producteurs peuvent publier leurs offres dans l’onglet Vendre.</div>');
}

function vVendre(){
 return '<h2>Publier mon stock</h2><div class="card">'+
 '<label for="f-p">Produit</label><input id="f-p" placeholder="Ex. : igname, manioc, maïs">'+
 '<label for="f-q">Quantité disponible (kg)</label><input id="f-q" type="number" inputmode="numeric" min="1">'+
 '<label for="f-pr">Prix par kilo (F CFA)</label><input id="f-pr" type="number" inputmode="numeric" min="1">'+
 '<label for="f-v">Village</label><input id="f-v" value="Aniassué">'+
 '<label for="f-w">Nom du producteur</label><input id="f-w">'+
 '<label for="f-t">Téléphone (WhatsApp)</label><input id="f-t" type="tel" inputmode="tel" placeholder="+225 …">'+
 '<div class="err" id="f-err"></div>'+
 '<button class="btn block" onclick="publish()">Publier mon stock</button></div>';
}
function publish(){
 var g=function(i){return document.getElementById(i).value.trim()};
 var p=g("f-p"),q=parseInt(g("f-q"),10),pr=parseInt(g("f-pr"),10),v=g("f-v"),w=g("f-w"),err=document.getElementById("f-err");
 if(!p||!w||!v){err.textContent="Renseigne le produit, le village et ton nom.";return}
 if(!(q>0)||!(pr>0)){err.textContent="La quantité et le prix doivent être supérieurs à 0.";return}
 S.stocks.unshift({id:S.next++,p:p,v:v,who:w,q:q,pr:pr});save();
 toast("Stock publié");go("marche");
}

function buy(id){pick=id;go("acheter")}
function vAcheter(){
 var av=S.stocks.filter(function(s){return s.q>0});
 if(!av.length)return '<h2>Acheter en gros</h2><div class="empty">Aucun stock disponible pour le moment.</div>';
 if(!av.some(function(s){return s.id===pick}))pick=av[0].id;
 var opts=av.map(function(s){return '<option value="'+s.id+'"'+(s.id===pick?" selected":"")+'>'+esc(s.p)+" · "+esc(s.v)+" · "+F(s.pr)+"/kg ("+s.q+" kg)</option>"}).join("");
 var dest=Object.keys(TRANSPORT).map(function(c){return "<option>"+c+"</option>"}).join("");
 return '<h2>Acheter en gros</h2><div class="card">'+
 '<label for="b-s">Produit</label><select id="b-s" onchange="pick=+this.value;calc()">'+opts+'</select>'+
 '<label for="b-q">Quantité (kg)</label><input id="b-q" type="number" inputmode="numeric" min="1" value="500" oninput="calc()">'+
 '<label for="b-d">Ville de livraison</label><select id="b-d" onchange="calc()">'+dest+'</select>'+
 '<div class="sum" id="b-sum"></div><div class="err" id="b-err"></div>'+
 '<button class="btn block" onclick="order()">Confirmer la commande</button></div>'+
 '<p class="muted">Ton argent reste bloqué et n’est versé au producteur qu’après la livraison. Tarifs de transport d’exemple.</p>';
}
function calcData(){
 var s=S.stocks.filter(function(x){return x.id===pick})[0];if(!s)return null;
 var q=parseInt(document.getElementById("b-q").value,10)||0,d=document.getElementById("b-d").value;
 var goods=q*s.pr,tr=q*TRANSPORT[d],com=Math.round(goods*COM);
 return {s:s,q:q,d:d,goods:goods,tr:tr,com:com,tot:goods+tr+com};
}
function calc(){
 var c=calcData();if(!c)return;
 document.getElementById("b-sum").innerHTML=
 "<div><span>Produits</span><span>"+F(c.goods)+"</span></div>"+
 "<div><span>Transport vers "+esc(c.d)+"</span><span>"+F(c.tr)+"</span></div>"+
 "<div><span>Frais de la plateforme (5 %)</span><span>"+F(c.com)+"</span></div>"+
 '<div class="tot"><span>Total à payer</span><span>'+F(c.tot)+"</span></div>";
 document.getElementById("b-err").textContent="";
}
function order(){
 var c=calcData(),err=document.getElementById("b-err");if(!c)return;
 if(!(c.q>0)){err.textContent="Indique une quantité supérieure à 0.";return}
 if(c.q>c.s.q){err.textContent="Il ne reste que "+c.s.q+" kg de "+c.s.p+".";return}
 var oldQuantity=c.s.q,oldNext=S.next;c.s.q-=c.q;
 S.orders.unshift({id:S.next++,p:c.s.p,v:c.s.v,who:c.s.who,q:c.q,d:c.d,tot:c.tot,step:0});
 if(!save()){c.s.q=oldQuantity;S.orders.shift();S.next=oldNext;return}toast("Commande de démonstration enregistrée");go("commandes");
}


function vStands(){
 var cards=standListings.slice().reverse().map(function(x){
  return '<div class="card">'+(x.photo?'<img src="'+x.photo+'" alt="Photo de '+esc(x.product)+'" style="width:100%;max-height:210px;object-fit:cover;border-radius:9px">':'')+
  '<div class="row" style="margin-top:8px"><h3>'+esc(x.product)+'</h3><strong>'+F(x.price)+' / '+esc(x.unit)+'</strong></div>'+
  '<p class="muted">'+esc(x.locality)+' · '+esc(x.quantity)+' '+esc(x.unit)+' disponibles</p>'+
  (x.description?'<p>'+esc(x.description)+'</p>':'')+
  '<p class="muted"><strong>En attente de vérification</strong> · Annonce enregistrée sur cet appareil</p></div>';
 }).join("");
 return '<h2>Stands des producteurs</h2><p class="muted">Présente tes récoltes avec une photo. Pour le moment, les annonces restent sur cet appareil et ne sont pas visibles par les autres utilisateurs.</p>'+
 '<div class="card"><h3>Créer une annonce de stand</h3>'+
 '<label for="s-product">Produit</label><input id="s-product" placeholder="Ex. : igname Kponan">'+
 '<label for="s-photo">Photo du produit (facultative)</label><input id="s-photo" type="file" accept="image/*" onchange="previewStandPhoto(this)"><div id="s-photo-preview" class="muted"></div>'+
 '<label for="s-quantity">Quantité disponible</label><input id="s-quantity" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="Ex. : 500">'+
 '<label for="s-unit">Unité</label><select id="s-unit"><option>kg</option><option>sac</option><option>tonne</option><option>panier</option><option>tas</option><option>autre</option></select>'+
 '<label for="s-price">Prix demandé (FCFA par unité)</label><input id="s-price" type="number" min="1" inputmode="numeric">'+
 '<label for="s-locality">Village ou ville</label><input id="s-locality" value="Aniassué">'+
 '<label for="s-description">Description (facultatif)</label><input id="s-description" maxlength="250" placeholder="Qualité, période de récolte, disponibilité…">'+
 '<div class="err" id="s-error"></div><button class="btn block" onclick="saveStandListing()">Enregistrer mon annonce</button></div>'+
 '<h2>Annonces enregistrées sur cet appareil</h2>'+(cards||'<div class="empty">Aucun stand enregistré pour le moment.</div>');
}
function previewStandPhoto(input){
 var file=input.files&&input.files[0];standPhotoData="";
 var preview=document.getElementById("s-photo-preview");if(!file||!preview)return;
 if(!file.type.match(/^image\//)){preview.textContent="Choisis un fichier image.";input.value="";return}
 if(file.size>8*1024*1024){preview.textContent="Image trop volumineuse (maximum 8 Mo).";input.value="";return}
 var reader=new FileReader();
 reader.onload=function(){
  var img=new Image();img.onload=function(){
   var scale=Math.min(1,900/Math.max(img.width,img.height)),canvas=document.createElement("canvas");
   canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
   canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
   standPhotoData=canvas.toDataURL("image/jpeg",0.72);
   preview.innerHTML='<img src="'+standPhotoData+'" alt="Aperçu du produit" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px">';
  };img.src=reader.result;
 };reader.readAsDataURL(file);
}
function saveStandListing(){
 var g=function(id){return document.getElementById(id).value.trim()};
 var x={product:g("s-product"),quantity:Number(g("s-quantity")),unit:g("s-unit"),price:Number(g("s-price")),locality:g("s-locality"),description:g("s-description"),photo:standPhotoData,status:"pending",savedAt:new Date().toISOString()};
 var err=document.getElementById("s-error");
 if(!x.product||!x.locality||!(x.quantity>0)||!(x.price>0)){err.textContent="Renseigne le produit, la localité, une quantité et un prix valides.";return}
 standListings.push(x);saveStands();standPhotoData="";toast("Annonce enregistrée, en attente de vérification");render();
}
function vTransport(){
 var cards=transporters.slice().reverse().map(function(x){
  return '<div class="card"><div class="row"><h3>'+esc(x.vehicle)+'</h3><strong>'+esc(x.capacity)+'</strong></div>'+
  '<p class="muted">'+esc(x.name)+' · '+esc(x.locality)+'</p><p>'+esc(x.routes)+'</p>'+
  '<p class="muted">Tarif indicatif : '+esc(x.rate||"À discuter")+' · <strong>En attente de vérification</strong></p></div>';
 }).join("");
 return '<h2>Espace transporteurs</h2><p class="muted">Inscris ton véhicule et indique les trajets que tu peux assurer. Les profils restent enregistrés sur cet appareil de démonstration.</p>'+
 '<div class="card"><h3>Inscrire un transporteur</h3>'+
 '<label for="t-name">Nom du transporteur ou de l’entreprise</label><input id="t-name">'+
 '<label for="t-vehicle">Type de véhicule</label><select id="t-vehicle"><option>Camion</option><option>Pick-up</option><option>Tricycle cargo</option><option>Fourgonnette</option><option>Autre</option></select>'+
 '<label for="t-capacity">Capacité de chargement</label><input id="t-capacity" placeholder="Ex. : 3 tonnes">'+
 '<label for="t-locality">Ville ou village de départ</label><input id="t-locality" value="Aniassué">'+
 '<label for="t-routes">Destinations desservies</label><input id="t-routes" placeholder="Ex. : Abengourou, Abidjan">'+
 '<label for="t-rate">Tarif indicatif (facultatif)</label><input id="t-rate" placeholder="Ex. : selon la distance">'+
 '<label for="t-contact">Contact WhatsApp (facultatif, non affiché dans la fiche)</label><input id="t-contact" type="tel" inputmode="tel" placeholder="+225 …">'+
 '<label for="t-availability">Disponibilité</label><select id="t-availability"><option>Disponible</option><option>Sur réservation</option><option>Indisponible temporairement</option></select>'+
 '<div class="err" id="t-error"></div><button class="btn block" onclick="saveTransporter()">Enregistrer mon profil transporteur</button></div>'+
 '<h2>Profils enregistrés sur cet appareil</h2>'+(cards||'<div class="empty">Aucun transporteur enregistré pour le moment.</div>');
}
function saveTransporter(){
 var g=function(id){return document.getElementById(id).value.trim()};
 var x={name:g("t-name"),vehicle:g("t-vehicle"),capacity:g("t-capacity"),locality:g("t-locality"),routes:g("t-routes"),rate:g("t-rate"),contact:g("t-contact"),availability:g("t-availability"),status:"pending",savedAt:new Date().toISOString()};
 var err=document.getElementById("t-error");
 if(!x.name||!x.capacity||!x.locality||!x.routes){err.textContent="Renseigne le nom, la capacité, le lieu de départ et les destinations.";return}
 transporters.push(x);saveTransporters();toast("Profil transporteur enregistré, en attente de vérification");render();
}

function vReleves(){
 var units=["kg","sac","bassine","tas","panier","autre"];
 var options=units.map(function(u){return "<option>"+u+"</option>"}).join("");
 var items=submissions.slice().reverse().map(function(x){
  return '<div class="card"><div class="row"><h3>'+esc(x.product)+'</h3><strong>'+F(x.marketPrice)+' / '+esc(x.unit)+'</strong></div><div class="muted">'+esc(x.locality)+' · '+esc(x.market)+' · '+esc(x.date)+'</div><p class="muted">Correspondant : '+esc(x.code)+' · <strong>En attente de vérification</strong></p></div>';
 }).join("");
 return '<h2>Transmettre un relevé de prix</h2><p class="muted">Formulaire pilote pour les correspondants d’Aniassué. Les données restent enregistrées sur ce téléphone de démonstration ; elles ne sont pas encore envoyées au serveur.</p><div class="card">'+
 '<label for="m-code">Code du correspondant</label><select id="m-code"><option>ANI-01</option><option>ANI-02</option><option>ANI-03</option></select>'+
 '<label for="m-locality">Localité</label><input id="m-locality" value="Aniassué">'+
 '<label for="m-market">Marché ou lieu du relevé</label><input id="m-market" placeholder="Ex. : marché d’Aniassué">'+
 '<label for="m-product">Produit</label><input id="m-product" placeholder="Ex. : igname Kponan">'+
 '<label for="m-producer">Prix payé au producteur (FCFA, facultatif)</label><input id="m-producer" type="number" inputmode="decimal" min="1" placeholder="Facultatif">'+
 '<label for="m-price">Prix de vente observé (FCFA)</label><input id="m-price" type="number" inputmode="decimal" min="1" required>'+
 '<label for="m-unit">Unité de prix</label><select id="m-unit">'+options+'</select>'+
 '<label for="m-quantity">Quantité observée (facultatif)</label><input id="m-quantity" type="number" inputmode="decimal" min="0.01" placeholder="Ex. : 5">'+
 '<label for="m-date">Date du relevé</label><input id="m-date" type="date" value="'+new Date().toISOString().slice(0,10)+'">'+
 '<label for="m-notes">Précisions (facultatif)</label><input id="m-notes" maxlength="300" placeholder="Ex. : prix constaté auprès de trois vendeurs">'+
 '<div class="err" id="m-error"></div><button class="btn block" onclick="saveReleve()">Enregistrer le relevé</button></div>'+
 '<h2>Relevés enregistrés sur cet appareil</h2>'+(items||'<div class="empty">Aucun relevé pour le moment.</div>');
}
function saveReleve(){
 var g=function(id){return document.getElementById(id).value.trim()};
 var d={code:g("m-code"),locality:g("m-locality"),market:g("m-market"),product:g("m-product"),producerPrice:g("m-producer"),marketPrice:g("m-price"),unit:g("m-unit"),quantity:g("m-quantity"),date:g("m-date"),notes:g("m-notes")};
 var err=document.getElementById("m-error");
 if(!d.locality||!d.market||!d.product||!d.date||!(Number(d.marketPrice)>0)){err.textContent="Vérifie la localité, le marché, le produit, la date et le prix.";return}
 if(d.producerPrice!==""&&!(Number(d.producerPrice)>0)){err.textContent="Le prix producteur doit être positif ou laissé vide.";return}
 if(d.quantity!==""&&!(Number(d.quantity)>0)){err.textContent="La quantité doit être positive ou laissée vide.";return}
 d.marketPrice=Number(d.marketPrice);d.producerPrice=d.producerPrice===""?null:Number(d.producerPrice);d.quantity=d.quantity===""?null:Number(d.quantity);
 d.status="pending";d.savedAt=new Date().toISOString();
 submissions.push(d);saveSubmissions();toast("Relevé enregistré sur cet appareil");render();
}
function vCommandes(){
 if(!S.orders.length)return '<h2>Mes commandes</h2><div class="empty">Aucune commande pour le moment. Choisis un produit dans l’onglet Marché.</div>';
 return '<h2>Mes commandes</h2>'+S.orders.map(function(o){
  var dots=STEPS.map(function(_,i){return '<span class="'+(i<=o.step?"on":"")+'"></span>'}).join("");
  var done=o.step===STEPS.length-1;
  return '<div class="card"><div class="row"><h3>'+esc(o.p)+' · '+o.q.toLocaleString("fr-FR")+' kg</h3><strong>'+F(o.tot)+'</strong></div>'+
  '<div class="muted">'+esc(o.v)+' → '+esc(o.d)+'</div><div class="steps" aria-hidden="true">'+dots+'</div>'+
  '<div><strong>'+STEPS[o.step]+'</strong></div>'+
  (done?'<div class="muted">Paiement versé au producteur.</div>':'<button class="btn ghost block" onclick="adv('+o.id+')">Passer à l’étape suivante</button>')+'</div>'}).join("");
}
function adv(id){
 var before=clone(S);S.orders.forEach(function(o){if(o.id===id&&o.step<STEPS.length-1)o.step++});
 if(!save()){S=before;return}render();
}


var WA="2250700081104",deferred=null;
function cta(){return '<div class="card" style="margin-top:14px"><strong>Producteur, grossiste ou transporteur ?</strong><div class="muted">Inscris-toi en 1 minute pour rejoindre le marché.</div><button class="btn block" onclick="go(\'inscription\')">Je m’inscris</button></div>'}
function vInscription(){
 var r={};try{r=JSON.parse(localStorage.getItem("ald-reg")||"{}")}catch(e){}
 var v=function(k){return esc(r[k]||"")};
 var roles=["Producteur","Grossiste / acheteur","Transporteur"].map(function(x){return "<option"+(r.role===x?" selected":"")+">"+x+"</option>"}).join("");
 return '<h2>Inscription</h2><div class="card" id="inst"></div><div class="card">'+
 '<label for="r-role">Je suis</label><select id="r-role">'+roles+'</select>'+
 '<label for="r-name">Nom complet</label><input id="r-name" value="'+v("name")+'">'+
 '<label for="r-tel">Numéro WhatsApp</label><input id="r-tel" type="tel" inputmode="tel" placeholder="+225 …" value="'+v("tel")+'">'+
 '<label for="r-vil">Village ou ville</label><input id="r-vil" value="'+v("vil")+'">'+
 '<label for="r-act">Mes produits ou mon activité</label><input id="r-act" placeholder="Ex. : igname, manioc ; ou camion 5 tonnes" value="'+v("act")+'">'+
 '<label for="r-qty">Quantité approximative (facultatif)</label><input id="r-qty" placeholder="Ex. : 2 tonnes par semaine" value="'+v("qty")+'">'+
 '<div class="err" id="r-err"></div>'+
 '<button class="btn block" onclick="register()">Envoyer mon inscription par WhatsApp</button><div id="r-link"></div></div>'+
 '<p class="muted">Ton inscription arrive directement sur le WhatsApp de l’équipe, qui te répond pour valider ton profil.</p>';
}
function register(){
 var g=function(i){return document.getElementById(i).value.trim()};
 var r={role:g("r-role"),name:g("r-name"),tel:g("r-tel"),vil:g("r-vil"),act:g("r-act"),qty:g("r-qty")},err=document.getElementById("r-err");
 if(!r.name||!r.vil||!r.act){err.textContent="Renseigne ton nom, ton village ou ta ville, et tes produits.";return}
 if(r.tel.replace(/\D/g,"").length<8){err.textContent="Entre un numéro WhatsApp valide.";return}
 if(!WA){err.textContent="Envoi désactivé : le numéro officiel WhatsApp de l’équipe doit d’abord être vérifié.";return}
 err.textContent="";
 var m="Inscription Aniassué lôgôfié douman\nProfil : "+r.role+"\nNom : "+r.name+"\nTéléphone : "+r.tel+"\nVillage / ville : "+r.vil+"\nProduits / activité : "+r.act+(r.qty?"\nQuantité approximative : "+r.qty:"");
 var url="https://wa.me/"+WA+"?text="+encodeURIComponent(m);
 document.getElementById("r-link").innerHTML='<a class="btn block" style="display:block;text-align:center;text-decoration:none" href="'+url+'" target="_blank" rel="noopener">Si WhatsApp ne s’ouvre pas, touche ici</a>';
 window.open(url,"_blank");
}
function showInstall(){
 var el=document.getElementById("inst");if(!el)return;
 el.innerHTML=deferred?'<strong>Installer l’application</strong><div class="muted">Elle s’ouvre comme une vraie application, sans passer par le Play Store.</div><button class="btn block" onclick="installApp()">Installer sur mon téléphone</button>':
 '<strong>Installer sur ton téléphone</strong><div class="muted">Android (Chrome) : menu ⋮ puis « Ajouter à l’écran d’accueil ».<br>iPhone (Safari) : bouton Partager puis « Sur l’écran d’accueil ».</div>';
}
function installApp(){if(!deferred)return;deferred.prompt();deferred.userChoice.then(function(){deferred=null;showInstall()})}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;showInstall()});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

function render(){
 var views={inscription:vInscription,marche:vMarche,vendre:vVendre,acheter:vAcheter,commandes:vCommandes,releves:vReleves,stands:vStands,transport:vTransport};
 document.getElementById("app").innerHTML=views[tab]()+'<button class="reset" onclick="resetAll()">Remettre les données de démonstration</button>';
 document.querySelectorAll("nav button").forEach(function(b){
  if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
 });
 if(tab==="acheter")calc();
 if(tab==="inscription")showInstall();
}
function resetAll(){S=clone(SEED);pick=null;save();toast("Données remises à zéro");go("marche")}
document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.tab)})});
render();
</script>
</body>
</html>
